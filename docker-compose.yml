services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: glintex
      POSTGRES_USER: glintex
      POSTGRES_PASSWORD: glintex
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U glintex -d glintex" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://glintex:glintex@db:5432/glintex
      SHADOW_DATABASE_URL: postgresql://glintex:glintex@db:5432/glintex_shadow
      PORT: 4000
      BARCODE_MATERIAL_CODE: ${BARCODE_MATERIAL_CODE:-MET}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI}
      WWEBJS_WEB_VERSION: ${WWEBJS_WEB_VERSION:-2.3000.1031548524}
      WWEBJS_WEB_CACHE_STRICT: ${WWEBJS_WEB_CACHE_STRICT:-true}
      WWEBJS_WEB_CACHE_PATH: ${WWEBJS_WEB_CACHE_PATH:-/app/.wwebjs_cache}
      PERF_LOG: ${PERF_LOG:-0}
      PERF_LOG_QUERIES: ${PERF_LOG_QUERIES:-0}
      PERF_SLOW_QUERY_MS: ${PERF_SLOW_QUERY_MS:-100}
      PERF_SLOW_REQUEST_MS: ${PERF_SLOW_REQUEST_MS:-0}
    volumes:
      - ./apps/backend/.wwebjs_auth:/app/.wwebjs_auth
      - ./apps/backend/.wwebjs_cache:/app/.wwebjs_cache
      - ./apps/backend/backups:/app/backups
      - ./apps/backend/logs:/app/logs
    shm_size: '1gb'
    ports:
      - "${BACKEND_PORT:-4001}:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.agent
    command: ["node", "src/agentServer.js"]
    environment:
      DATABASE_URL: postgresql://glintex:glintex@db:5432/glintex
      AGENT_API_PORT: 4003
      GLINTEX_APP_BASE_URL: http://backend:4000
      GLINTEX_DEPLOY_SHA: ${GLINTEX_DEPLOY_SHA:-unknown}
      GLINTEX_OWNER_AGENT_ID: ${GLINTEX_OWNER_AGENT_ID:-glintex-owner}
      GLINTEX_OWNER_TELEGRAM_ID: ${GLINTEX_OWNER_TELEGRAM_ID}
      GLINTEX_OWNER_AGENT_TOKEN_SHA256: ${GLINTEX_OWNER_AGENT_TOKEN_SHA256}
      GLINTEX_OWNER_AGENT_CONFIRMATION_SECRET: ${GLINTEX_OWNER_AGENT_CONFIRMATION_SECRET}
      GLINTEX_OWNER_AGENT_SCOPES: ${GLINTEX_OWNER_AGENT_SCOPES:-app.read,finance.read,system.read,tasks.read,tasks.write,learning.read,learning.propose,operations.read,operations.write,audit.write}
      GLINTEX_AGENT_ACTION_TTL_SECONDS: ${GLINTEX_AGENT_ACTION_TTL_SECONDS:-600}
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "${AGENT_API_PORT:-4003}:4003"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4001}
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  backend-whatsapp-auth:

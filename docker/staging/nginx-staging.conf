server {
    listen 80;
    listen [::]:80;
    server_name staging.glintex.in;

    auth_basic "GLINTEX Staging";
    auth_basic_user_file /etc/nginx/glintex-staging.htpasswd;

    client_max_body_size 20m;

    location = /__staging_gate {
        internal;
        auth_basic off;
        if ($cookie_glintex_staging_gate = "__STAGING_GATE_TOKEN__") {
            return 204;
        }
        return 401;
    }

    location /api/ {
        satisfy any;
        auth_request /__staging_gate;
        add_header Set-Cookie "glintex_staging_gate=__STAGING_GATE_TOKEN__; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=Strict";
        proxy_pass http://127.0.0.1:4102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        satisfy any;
        auth_request /__staging_gate;
        add_header Set-Cookie "glintex_staging_gate=__STAGING_GATE_TOKEN__; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=Strict";
        proxy_pass http://127.0.0.1:4273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

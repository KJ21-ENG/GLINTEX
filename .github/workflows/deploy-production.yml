name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, health-check backend, then replace frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production_deploy_key
          chmod 600 ~/.ssh/production_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/production_deploy_key "$SSH_USER@$SSH_HOST" \
            bash -s -- "$APP_DIR" "$DEPLOY_SHA" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          app_dir=$1
          deploy_sha=$2
          cd "$app_dir"

          previous_sha=$(git rev-parse HEAD)
          deployment_started=0
          compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)

          rollback() {
            result=$?
            trap - ERR
            if [ "$deployment_started" -eq 1 ]; then
              echo "Deployment failed. Restoring $previous_sha"
              export GLINTEX_DEPLOY_SHA="$previous_sha"
              git checkout --detach "$previous_sha"
              "${compose[@]}" build backend frontend
              "${compose[@]}" up -d --no-deps --wait backend frontend
              "${compose[@]}" exec -T backend wget -qO- http://127.0.0.1:4000/api/health >/dev/null
              "${compose[@]}" exec -T frontend wget -qO- http://127.0.0.1/ >/dev/null
              echo "Rollback to $previous_sha passed health checks"
            fi
            exit "$result"
          }
          trap rollback ERR

          git fetch origin "$deploy_sha"
          git checkout --detach "$deploy_sha"
          test "$(git rev-parse HEAD)" = "$deploy_sha"
          export GLINTEX_DEPLOY_SHA="$deploy_sha"
          deployment_started=1

          "${compose[@]}" up -d db
          "${compose[@]}" build backend frontend
          "${compose[@]}" --profile migration run --rm migrate
          "${compose[@]}" up -d --no-deps --wait backend
          "${compose[@]}" exec -T backend wget -qO- http://127.0.0.1:4000/api/health >/dev/null
          "${compose[@]}" run --rm --no-deps frontend nginx -t
          "${compose[@]}" up -d --no-deps --wait frontend
          "${compose[@]}" exec -T frontend wget -qO- http://127.0.0.1/ >/dev/null
          "${compose[@]}" up -d agent-api

          trap - ERR
          REMOTE_SCRIPT
